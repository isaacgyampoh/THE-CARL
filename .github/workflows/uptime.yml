# Is Zazi answering?
#
# Render restarts an instance that fails its own health check, which handles the common case.
# What it does not do is tell a person when the whole thing is down — and the failure that
# matters most, an API that is up while its database is unreachable, looks healthy from the
# outside unless you ask the right endpoint.
#
# This asks the right endpoint, every ten minutes, from outside Render. A failure fails the
# workflow, and GitHub emails whoever owns the repository. No account to open, nothing to pay.

name: Uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# A check that queues behind an earlier one tells you nothing new.
concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    name: Production is answering
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: The API can reach its database
        run: |
          # /ready, not /health: a process that is up with no database answers /health happily
          # and can serve nothing. Two attempts, because one dropped packet is not an outage.
          for attempt in 1 2; do
            code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' --max-time 20 https://api.getzazi.com/ready || echo 000)
            [ "$code" = "200" ] && exit 0
            echo "attempt $attempt: /ready answered $code" >&2
            sleep 15
          done
          echo "::error::api.getzazi.com/ready is not answering 200. Check the Render dashboard." >&2
          cat /tmp/ready.json >&2 || true
          exit 1

      - name: The portal is serving its sign-in page
        run: |
          for attempt in 1 2; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://app.getzazi.com/sign-in || echo 000)
            [ "$code" = "200" ] && exit 0
            echo "attempt $attempt: /sign-in answered $code" >&2
            sleep 15
          done
          echo "::error::app.getzazi.com/sign-in is not answering 200." >&2
          exit 1

      - name: TLS certificates are not about to expire
        run: |
          # A certificate that expires on a Sunday takes the whole product down with it.
          for host in api.getzazi.com app.getzazi.com; do
            end=$(echo | openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null \
                  | openssl x509 -noout -enddate | cut -d= -f2)
            days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
            echo "$host certificate expires in $days days ($end)"
            if [ "$days" -lt 10 ]; then
              echo "::error::$host certificate expires in $days days." >&2
              exit 1
            fi
          done
