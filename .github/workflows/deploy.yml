# Zazi: build, test, then deploy.
#
# Render can deploy on its own whenever main changes, and that is deliberately NOT how this
# is set up (render.yaml sets autoDeploy: false). Auto-deploy ships whatever was pushed,
# including a commit whose tests fail — which for a system holding other people's financial
# records is the wrong default. This workflow is the only thing that deploys, so the tests
# are a gate rather than a report.
#
# Deploy hooks rather than the Render CLI: a hook is a single authenticated POST with nothing
# to install, version or keep working. Fewer moving parts in the path to production.

name: Deploy

on:
  push:
    branches: [main]
  # Lets a known-good commit be redeployed from the Actions tab without a code change,
  # which is the rollback path: re-run this workflow against an earlier commit.
  workflow_dispatch:

concurrency:
  # One deploy at a time. Two overlapping runs can apply migrations concurrently, and the
  # second would be racing the first against the same database.
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        # The integration tests need a real PostgreSQL: the transactions, partial indexes and
        # advisory locks they rely on are things the in-memory provider only pretends to have.
        image: postgres:16
        env:
          POSTGRES_USER: carl
          POSTGRES_PASSWORD: carl-test-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          # Honours global.json, so CI cannot silently build on a different SDK band than
          # the one this project is developed and tested against.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Zazi.sln

      - name: Build
        run: dotnet build Zazi.sln -c Release --no-restore

      - name: Test
        env:
          ZAZI_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=carl;Password=carl-test-password
        run: |
          set -o pipefail
          dotnet test Zazi.sln -c Release --no-build --logger "console;verbosity=normal" \
            | tee test-output.txt

          # Without a reachable database the integration tests SKIP rather than fail, so a
          # broken CI database would produce a green build that proved almost nothing. Exactly
          # one skip is expected: the opt-in live-email test, which really should not run here.
          skipped=$(grep -oE 'Skipped: +[0-9]+' test-output.txt \
                    | grep -oE '[0-9]+' | paste -sd+ - | bc)
          echo "Skipped tests: ${skipped:-0}"
          if [ "${skipped:-0}" -gt 1 ]; then
            echo "More tests were skipped than the one opt-in live-email test." >&2
            echo "That usually means the PostgreSQL service was unreachable, so the" >&2
            echo "integration suite did not actually run. Refusing to deploy." >&2
            exit 1
          fi

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    # Belt and braces: `needs` already blocks this on failure, and this makes it explicit
    # that nothing deploys from a red build.
    if: success()

    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      # Service ids, not secrets — they appear in every dashboard URL. Keeping them here
      # rather than in secrets means a missing deploy is a missing *key*, one thing to check.
      API_SERVICE_ID: srv-dao4jrugekts73asa6ig
      WEB_SERVICE_ID: srv-dao4kqmgekts73asdkkg

    steps:
      - uses: actions/checkout@v4

      - name: Deploy the API
        # The API first, always. It is the service that applies EF migrations on startup, and
        # the web portal reads the same database — so a portal started against an unmigrated
        # schema fails on the first query touching a new column.
        #
        # The script waits for Render's own verdict on the build rather than inferring one
        # from a health endpoint, which answers from the outgoing container until the swap.
        run: ./scripts/render-deploy.sh "$API_SERVICE_ID" "API"

      - name: Check the API is serving
        # Separate from the deploy above, and deliberately so: "the build went live" and "it
        # answers requests" are different claims, and a container that starts and then falls
        # over on its first real request satisfies only the first.
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${{ vars.API_HEALTH_URL }}" || true)
            if [ "$code" = "200" ]; then echo "API healthy after ${attempt} attempt(s)."; exit 0; fi
            sleep 10
          done
          echo "The API deployed but is not serving; not deploying the web portal." >&2
          exit 1

      - name: Deploy the web portal
        run: ./scripts/render-deploy.sh "$WEB_SERVICE_ID" "Web portal"

      - name: Check the portal is serving
        run: |
          # A first request after the swap can land on a container that is still warming and
          # come back 502, so this retries rather than judging on one attempt.
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${{ vars.WEB_SIGNIN_URL }}" || true)
            if [ "$code" = "200" ]; then echo "Portal healthy after ${attempt} attempt(s)."; exit 0; fi
            sleep 10
          done
          echo "The portal deployed but is not serving. To roll back: open the service in the" >&2
          echo "Render dashboard, go to Events, find the last good deploy and choose Rollback." >&2
          exit 1
