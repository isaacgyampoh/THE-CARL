<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
  html,body{margin:0;padding:0}
  .g{width:1024px;height:500px;background:#0B1F33;display:flex;align-items:center;gap:48px;padding:0 64px;box-sizing:border-box;
     font-family:Inter,system-ui,sans-serif;color:#fff}
  .tile{width:132px;height:132px;border-radius:32px;background:#F2A900;display:grid;place-items:center;flex:none}
  .tile svg{width:74px;height:74px;fill:#0B1F33}
  h1{font-size:54px;line-height:1.05;margin:0 0 14px;letter-spacing:-.03em;font-weight:700}
  p{margin:0;font-size:24px;color:#A9B8C9;line-height:1.4}
  .em{color:#F2A900}
  .points{margin-top:22px;display:flex;gap:26px;font-size:19px;color:#E7ECF3}
  .points span{display:flex;align-items:center;gap:9px}
  .dot{width:11px;height:11px;border-radius:50%;background:#12A16F;display:inline-block}
</style></head><body>
  <div class="g">
    <div class="tile"><svg viewBox="0 0 100 100"><path d="M0,0 L88,0 L88,20 L30,80 L100,80 L100,100 L12,100 L12,80 L70,20 L0,20 Z"/></svg></div>
    <div>
      <h1>Every cedi,<br><span class="em">accounted for.</span></h1>
      <p>Mobile money records for Ghanaian agents — cash, float and commission.</p>
      <div class="points">
        <span><i class="dot"></i>Works offline</span>
        <span><i class="dot"></i>Keypad phones by SMS</span>
        <span><i class="dot"></i>Day-end counts</span>
      </div>
    </div>
  </div>
</body></html>
